name: Build SA-MP Mobile Client

on:
  push:
    branches: [ "main", "master" ] # Berjalan otomatis setiap kamu update kode
  workflow_dispatch: # Memungkinkan kamu menekan tombol "Run" manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v3

    # Penting untuk SA-MP Android karena menggunakan C++ (CMake & NDK)
    - name: Install NDK and CMake
      run: |
        sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: samp-client-release-apk
        path: app/build/outputs/apk/release/*.apk
